services:
  dev:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:postgres
    environment:
      DATABASE_URL: postgresql://emmapp:emmapp_secret@localhost:5432/emmapp?schema=public
      JWT_SECRET: dev-secret-codespaces
      PORT: "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emmapp
      POSTGRES_PASSWORD: emmapp_secret
      POSTGRES_DB: emmapp
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
