name: Build Android AAB for Google Play

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL API production'
        required: false
        default: 'https://emmapp-api.onrender.com/api/v1'
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-playstore.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            echo "generated=false" >> $GITHUB_OUTPUT
          else
            echo "Generation automatique du keystore (premiere fois)"
            STORE_PASS="emmapp_keystore_2026"
            KEY_PASS="emmapp_keystore_2026"
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=EMMAPP Mobile, OU=Mobile, O=EMMAPP, L=Kinshasa, C=CD"
            echo "generated=true" >> $GITHUB_OUTPUT
          fi
          cat > android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Upload keystore backup (if auto-generated)
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emmapp-keystore-BACKUP
          path: mobile/android/app/upload-keystore.jks
          retention-days: 90

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://emmapp-api.onrender.com/api/v1' }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: emmapp-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Summary
        if: steps.signing.outputs.generated == 'true'
        run: |
          echo "### Keystore auto-genere" >> $GITHUB_STEP_SUMMARY
          echo "Telechargez **emmapp-keystore-BACKUP** et conservez-le. Mot de passe : emmapp_keystore_2026" >> $GITHUB_STEP_SUMMARY

      - name: Summary AAB
        run: |
          echo "### AAB genere avec succes" >> $GITHUB_STEP_SUMMARY
          echo "Telechargez **emmapp-release-aab** pour Google Play Console." >> $GITHUB_STEP_SUMMARY
