services:
  postgres:
    image: postgres:16-alpine
    container_name: emmapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: emmapp
      POSTGRES_PASSWORD: emmapp_secret
      POSTGRES_DB: emmapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
